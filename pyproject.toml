[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gmail-notifier"
version = "0.1.0"
description = "Gmail Tray Notifier: Android-style Gmail notifications for the Windows tray. 100% local."
requires-python = ">=3.11"
dependencies = [
    "pystray>=0.19",
    "Pillow>=10.0",
    "google-api-python-client>=2.100",
    "google-auth>=2.23",
    "google-auth-oauthlib>=1.1",
    "google-auth-httplib2>=0.1",
    "keyring>=24.0",
    # Pinned exactly: the toast boundary (text_utils.escape_winotify, D-18) is
    # calibrated to this version's script TEMPLATE; tests/test_winotify_tripwire.py
    # enforces the pin and explains the re-audit steps for a bump.
    "winotify==1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "pyinstaller>=6.0",
    "pip-audit>=2.7",
    "bandit>=1.7",
    # Dev-only measurement tooling (scripts/measure_idle.py, scripts/soak_monitor.py);
    # never imported by the app, never bundled into the exe (DECISIONS D-22).
    "psutil>=5.9",
]

[project.scripts]
gmail-notifier = "gmail_notifier.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["gmail_notifier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
