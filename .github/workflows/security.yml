# Security CI: tests, lint, static security scan, dependency audit, secret scan.
# Runs on every push and pull request with read-only repository permissions.
name: security

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-scan:
    # The app is Windows-only (pystray/win32, winotify); tests run on Windows.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Unit tests (offline, fake data)
        run: python -m pytest
      - name: Lint
        run: ruff check .
      - name: Static security scan (no medium/high findings)
        run: python -m bandit -r src -ll
      - name: Dependency vulnerability audit
        run: python -m pip_audit

  gitleaks:
    # Secret scan over the full history; blocks on any finding.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
